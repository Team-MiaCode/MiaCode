name: Release
run-name: Release ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Release version for branches outside release/<version>.
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/package.yml
    with:
      channel: release
      expected_version: ${{ inputs.expected_version }}
